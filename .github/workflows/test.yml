name: Production Deployment TEST

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Debug runner environment
        run: |
          echo "whoami: $(whoami)"
          echo "HOME: $HOME"
          pwd
          ls -ld "$HOME" || true
          touch "$HOME/test-write" || true
      - name: Debug SSH directory
        run: |
          echo "HOME=$HOME"
          ls -la "$HOME"
          ls -ld "$HOME/.ssh" || true
          file "$HOME/.ssh" || true

          mkdir -pv "$HOME/.ssh"

          ls -ld "$HOME/.ssh"
